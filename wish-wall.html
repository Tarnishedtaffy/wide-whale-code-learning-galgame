<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>许愿便签墙 · Wish Wall</title>
<!--
  许愿便签墙 · 单文件纯前端应用（HTML+CSS+JS 全内嵌）
  主题：程序员/摸鱼 · 许愿池 · 便签墙
  形象图：取自本仓库 mobile.html 的内建立绘（wide whale 吉祥物）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0f1e;
    --line:rgba(148,163,184,.16);
    --txt:#e2e8f0;
    --dim:#94a3b8;
    --mono:'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
    --hand:'Ma Shan Zheng','Zhi Mang Xing','KaiTi','楷体','STKaiti',cursive;
  }
  body{
    /* 主题色（摸鱼默认），切换主题时由 body class 覆盖 */
    --ac:#38bdf8;--ac2:#0284c7;--glow:rgba(56,189,248,.18);
    height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;
    display:flex;flex-direction:column;
    color:var(--txt);font-family:var(--mono);
    background:
      radial-gradient(1100px 560px at 75% -10%, var(--glow), transparent 60%),
      radial-gradient(900px 520px at 8% 112%, rgba(99,102,241,.14), transparent 62%),
      var(--bg);
  }
  body.theme-tuodan{--ac:#fb7185;--ac2:#e11d48;--glow:rgba(251,113,133,.2)}
  body.theme-facai {--ac:#fbbf24;--ac2:#d97706;--glow:rgba(251,191,36,.2)}

  /* 极客网格底纹 */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(148,163,184,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.05) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at 50% 40%, #000 30%, transparent 90%);
  }
  /* 主题漂浮文案层 */
  #fx{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  #fx span{
    position:absolute;white-space:nowrap;color:var(--ac);opacity:.09;
    font-family:var(--mono);animation:drift ease-in-out infinite alternate;
  }
  @keyframes drift{from{transform:translateY(-12px) rotate(-2deg)}to{transform:translateY(14px) rotate(2deg)}}

  /* ---------- 头部 ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 26px 8px;position:relative;z-index:1}
  .brand h1{
    font-family:var(--hand);font-weight:400;font-size:30px;letter-spacing:3px;
    background:linear-gradient(120deg,var(--ac) 15%,#e2e8f0 55%,var(--ac2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand h1 .chip{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 9px;margin-left:10px;vertical-align:6px;letter-spacing:1px}
  #tagline{font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.5px}

  /* 主题下拉菜单 */
  .theme-dd{position:relative}
  #themeBtn{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    background:rgba(15,23,42,.72);border:1px solid var(--line);color:var(--txt);
    padding:9px 14px;border-radius:10px;font-family:var(--mono);font-size:13px;transition:.2s;
  }
  #themeBtn:hover{border-color:var(--ac);box-shadow:0 0 16px var(--glow)}
  #themeBtn .caret{font-size:10px;color:var(--dim);transition:.2s}
  .theme-dd.open .caret{transform:rotate(180deg)}
  .menu{
    position:absolute;right:0;top:calc(100% + 8px);min-width:176px;z-index:60;
    background:rgba(15,23,42,.97);border:1px solid var(--line);border-radius:12px;padding:6px;
    opacity:0;visibility:hidden;transform:translateY(-6px);transition:.18s;
    box-shadow:0 18px 44px rgba(0,0,0,.55);
  }
  .theme-dd.open .menu{opacity:1;visibility:visible;transform:none}
  .menu button{
    display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
    background:none;border:0;color:var(--txt);padding:9px 12px;border-radius:8px;
    cursor:pointer;font-family:var(--mono);font-size:13px;
  }
  .menu button:hover{background:rgba(148,163,184,.12)}
  .menu button.on{color:var(--ac)}
  .menu button.on::after{content:'✓'}

  /* ---------- 发愿区（终端风） ---------- */
  .composer{width:min(880px,94vw);margin:2px auto 10px;position:relative;z-index:1}
  .term{
    background:rgba(10,16,32,.84);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    backdrop-filter:blur(10px);box-shadow:0 18px 50px rgba(0,0,0,.45);
    transition:border-color .2s, box-shadow .2s;
  }
  .term:focus-within{border-color:var(--ac);box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 26px var(--glow)}
  .term-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(148,163,184,.05)}
  .dot{width:11px;height:11px;border-radius:50%}
  .dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
  .term-title{margin-left:6px;font-size:12px;color:var(--dim)}
  .term-body{padding:14px 16px 13px}
  .wish-row{display:flex;align-items:center;gap:10px;min-width:0}
  .prompt{color:var(--ac);font-weight:600;user-select:none;flex-shrink:0}
  #wishInput{
    flex:1;min-width:0;background:transparent;border:0;outline:0;
    color:var(--txt);font-family:var(--mono);font-size:15px;caret-color:var(--ac);
  }
  #wishInput::placeholder{color:#475569}
  .tool-row{display:flex;align-items:center;gap:10px;margin-top:13px;flex-wrap:wrap}
  .sw{
    width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;flex-shrink:0;
    box-shadow:inset 0 -3px 5px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.4);transition:.15s;
  }
  .sw:hover{transform:scale(1.18)}
  .sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--ac),0 2px 6px rgba(0,0,0,.4);transform:scale(1.12)}
  .sw.custom{position:relative;background:conic-gradient(#f43f5e,#f59e0b,#84cc16,#06b6d4,#6366f1,#d946ef,#f43f5e)}
  .sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .spacer{flex:1}
  .btn{border:0;border-radius:10px;padding:9px 18px;cursor:pointer;font-family:var(--mono);font-size:13px;transition:.18s;flex-shrink:0}
  .btn-ghost{background:rgba(148,163,184,.1);color:var(--txt);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--ac);color:var(--ac);box-shadow:0 0 14px var(--glow)}
  .btn-main{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0b1020;font-weight:700}
  .btn-main:hover{transform:translateY(-2px);box-shadow:0 8px 22px var(--glow),0 0 16px var(--glow)}
  .btn-main:active{transform:translateY(0)}
  .shake{animation:shake .32s}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  /* ---------- 便签墙 ---------- */
  #wall{
    flex:1;min-height:0;position:relative;z-index:1;margin:6px 24px 14px;
    border:1px dashed rgba(148,163,184,.18);border-radius:16px;background:rgba(148,163,184,.03);
  }
  #wall::after{content:'WISH_WALL // 许愿池在线';position:absolute;top:10px;left:16px;font-size:10px;letter-spacing:2px;color:rgba(148,163,184,.4);pointer-events:none}
  #hud{position:absolute;top:10px;right:14px;font-size:11px;letter-spacing:1px;color:var(--dim);pointer-events:none}
  #empty{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
  #empty .big{font-family:var(--hand);font-size:26px;color:#475569;letter-spacing:2px}
  #empty .sub{font-family:var(--mono);font-size:12px;color:#334155;margin-top:10px}

  /* 便签：拟物纸质感 */
  .note{
    position:absolute;width:200px;min-height:132px;padding:18px 14px 24px;
    border-radius:3px 3px 10px 3px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
    transform:rotate(var(--rot));
    box-shadow:
      0 12px 22px rgba(0,0,0,.42), 0 2px 5px rgba(0,0,0,.28),
      inset 0 1px 0 rgba(255,255,255,.35), inset 0 -16px 26px rgba(0,0,0,.07);
    transition:box-shadow .2s, transform .18s;
  }
  .note:active{cursor:grabbing}
  .note.dragging{
    transform:rotate(var(--rot)) scale(1.07);cursor:grabbing;
    box-shadow:0 26px 46px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);
  }
  .note .tape{
    position:absolute;top:-9px;left:50%;width:72px;height:20px;
    transform:translateX(-50%) rotate(var(--tp));
    background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.26));
    border-left:1px dashed rgba(255,255,255,.4);border-right:1px dashed rgba(255,255,255,.4);
    box-shadow:0 2px 4px rgba(0,0,0,.18);pointer-events:none;
  }
  .note .txt{
    font-family:var(--hand);font-size:18px;line-height:1.55;color:#37342b;
    min-height:66px;overflow-wrap:anywhere;padding:2px 2px 14px;
  }
  .note .meta{position:absolute;bottom:6px;left:12px;font-family:var(--mono);font-size:9px;letter-spacing:.5px;color:rgba(0,0,0,.45)}
  .note .stamp{
    display:none;position:absolute;top:12px;right:8px;transform:rotate(-14deg);
    font-family:var(--hand);font-size:13px;color:#d63031;border:2px solid #d63031;border-radius:6px;
    padding:1px 7px;opacity:.88;box-shadow:inset 0 0 8px rgba(214,48,49,.15);
  }
  .note.granted{box-shadow:0 14px 30px rgba(0,0,0,.5),0 0 22px var(--glow),0 0 46px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
  .note.granted{transform:rotate(var(--rot)) scale(1.1)}
  .note.granted .stamp{display:block}
  .note.pop{animation:pop .75s ease}
  @keyframes pop{0%{transform:rotate(var(--rot)) scale(1)}45%{transform:rotate(var(--rot)) scale(1.32)}100%{transform:rotate(var(--rot)) scale(1.1)}}
  .note.pop-in{animation:wishIn .4s cubic-bezier(.34,1.56,.64,1)}
  @keyframes wishIn{from{opacity:0;transform:rotate(var(--rot)) translateY(-30px) scale(.55)}}
  .note.bye{animation:bye .32s ease-in forwards;pointer-events:none}
  @keyframes bye{to{transform:rotate(calc(var(--rot) + 45deg)) scale(.15);opacity:0}}

  /* ---------- 吉祥物 ---------- */
  .mascot{position:absolute;left:12px;bottom:8px;display:flex;align-items:flex-end;gap:2px;z-index:5;cursor:pointer}
  .mascot img{width:118px;animation:floaty 4.5s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .bubble{
    position:relative;margin-bottom:46px;max-width:186px;
    background:#fdfdf8;color:#334155;font-family:var(--hand);font-size:14px;line-height:1.45;
    padding:9px 13px;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.4);
  }
  .bubble::after{content:'';position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:#fdfdf8;border-left:0}
  .bubble.say{animation:sayIn .35s ease}
  @keyframes sayIn{from{opacity:0;transform:translateY(6px) scale(.9)}}

  /* ---------- 提示 & 撒花 ---------- */
  #toasts{position:fixed;top:74px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:999}
  .toast{
    background:rgba(15,23,42,.95);border:1px solid var(--line);border-left:3px solid var(--ac);
    padding:10px 16px;border-radius:10px;font-size:13px;color:var(--txt);
    box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tIn .25s;transition:.3s;white-space:nowrap;
  }
  .toast.out{opacity:0;transform:translateY(-8px)}
  .toast .act{color:var(--ac);margin-left:12px;cursor:pointer;text-decoration:underline}
  @keyframes tIn{from{opacity:0;transform:translateY(-10px)}}
  .cf{position:fixed;z-index:9999;pointer-events:none;font-size:18px;animation:cf .9s ease-out forwards}
  @keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rr)) scale(1.15);opacity:0}}

  /* ---------- 响应式 ---------- */
  @media (max-width:760px){
    header{padding:12px 16px 6px}
    .brand h1{font-size:24px}
    .composer{width:94vw}
    .mascot img{width:82px}
    .bubble{max-width:132px;font-size:12px;margin-bottom:32px}
    .note{width:172px}
    #wall{margin:6px 12px 10px}
  }
</style>
</head>

<div id="fx"></div>

<header>

    <h1>许愿便签墙<span class="chip">wish-pool v1.0</span></h1>

</section>

<script>
'use strict';
/* ================= 工具 ================= */
const $=(s,p=document)=>p.querySelector(s);
const WALL=$('#wall'), FX=$('#fx'), INPUT=$('#wishInput'), BUB=$('#bubble'), TOASTS=$('#toasts');
const LS='wishwall.v1';
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const trunc=(s,n)=>s.length>n?s.slice(0,n)+'…':s;
const uid=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=ts=>{const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const cX=(x,w=216)=>clamp(x,8,Math.max(8,WALL.clientWidth-w));
const cY=y=>clamp(y,8,Math.max(8,WALL.clientHeight-186));

/* ================= 主题文案 ================= */
const THEMES={
  moyu:{
    name:'🐟 摸鱼模式', cls:'theme-moyu',
    tagline:'// 程序员许愿池 · CPU 空闲率 99%，适合许愿',
    words:['需求又双叒改了','明天上线','这个很简单','代码能跑就行','下班是不可能下班的','404: 动力未找到','正在摸鱼...','git push --force','线上很稳，别动','已读乱回','周报文学大师','摸鱼中请勿打扰'],
    ph:'比如：希望今晚的需求评审准时结束...',
    bubble:['摸鱼许愿，特别灵的～','再点一下我，换句口诀','愿望贴上墙，bug 绕道走','今天也要准时下班哦','许愿池水位正常，可以许愿'],
    cheer:['看吧，摸鱼时许的愿最灵！','这条愿望实现了，奖励自己一条鱼！','不可思议，但也许愿成功！']
  },
  tuodan:{
    name:'💘 脱单模式', cls:'theme-tuodan',
    tagline:'// 月老办事处 · 今日营业中',
    words:['脱单！','月老信号满格','心动预警','今天有桃花','脱单倒计时','丘比特已上线','缘分 +1','想恋爱了','红娘在岗','好想有人陪'],
    ph:'比如：希望下周在电梯里遇到心动的人...',
    bubble:['月老红线已就位 💘','愿望贴高一点，桃花来得快一点','你负责可爱，缘分负责安排','脱单签：大吉'],
    cheer:['哎呀，桃花来了！','月老表示：这单我接了！','脱单进度 +1，继续加油！']
  },
  facai:{
    name:'💰 暴富模式', cls:'theme-facai',
    tagline:'// 财神办事处 · 只收愿望不收税',
    words:['暴富','财务自由','一夜暴富','涨工资','中彩票','躺赚','搞钱要紧','钱包鼓鼓','分红到账','A股长红'],
    ph:'比如：希望年终奖多发三个月...',
    bubble:['财神爷正在派单中','搞钱人，搞钱魂','愿望要大声说出来才会富','暴富签：明日宜许愿'],
    cheer:['财神爷看了都说灵！','恭喜，离小目标又近一步！','这条愿望已入财神爷账本！']
  }
};
const COLORS=['#ffd43b','#fcc2d7','#74c0fc','#8ce99a','#b197fc','#ffa94d'];

/* ================= 状态 & 持久化 ================= */
let zTop=100, drag=null, lastDeleted=null, freeCells=[], curColor=COLORS[0];

function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(LS));return s&&Array.isArray(s.notes)?s:null}catch(e){return null}}

function seedState(){
  const s={theme:'moyu',no:0,notes:[]};
  [['愿代码无 bug，一次编译通过',0],['周五下午 6 点，准点下班！',2],
   ['线上永不报警，需求永不改',1],['给我 review 的人嘴下留情',4]]
  .forEach(([t,c])=>s.notes.push({id:uid(),no:++s.no,text:t,color:COLORS[c],x:null,y:null,rot:rand(-7,7),granted:false,z:++zTop,ts:Date.now()}));
  return s;
}
let state=load()||seedState();
state.notes.forEach(n=>zTop=Math.max(zTop,n.z||0));

/* ================= 颜色工具 ================= */
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const v=parseInt(h,16);return[v>>16&255,v>>8&255,v&255]}
function mix(h,t,k){const a=hex2rgb(h),b=hex2rgb(t);return a.map((v,i)=>Math.round(v*(1-k)+b[i]*k))}
function paperBG(hex){
  const [r,g,b]=hex2rgb(hex);
  const lum=(r*.299+g*.587+b*.114)/255;             // 太深的自定义色自动调浅
  const base=mix(hex,'#ffffff',lum<.55?.62:.12);
  const lite=mix(hex,'#ffffff',.5), dark=mix(hex,'#000000',.14);
  const rgba=c=>`rgba(${c[0]},${c[1]},${c[2]},.93)`; // 半透明纸质感
  return `linear-gradient(168deg, ${rgba(lite)}, ${rgba(base)} 55%, ${rgba(dark)})`;
}

/* ================= 便签 DOM ================= */
function spawnPos(){
  const W=WALL.clientWidth,H=WALL.clientHeight,cw=214,ch=190,pad=10;
  const cols=Math.max(1,Math.floor((W-pad*2)/cw)),rows=Math.max(1,Math.floor((H-pad*2)/ch));
  if(!freeCells.length){freeCells=[...Array(cols*rows).keys()];for(let i=freeCells.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[freeCells[i],freeCells[j]]=[freeCells[j],freeCells[i]]}}
  const i=freeCells.pop();
  return{x:cX(pad+(i%cols)*cw+rand(0,26),214),y:cY(pad+((i/cols)|0)*ch+rand(0,22))};
}
function makeNote(n){
  if(n.x==null){const p=spawnPos();n.x=p.x;n.y=p.y}
  if(!n.z)n.z=++zTop;
  const el=document.createElement('article');
  el.className='note'+(n.granted?' granted':'');
  el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.zIndex=n.z;
  el.style.setProperty('--rot',n.rot+'deg');
  el.style.setProperty('--tp',rand(-6,6).toFixed(1)+'deg');
  el.style.background=paperBG(n.color);
  el._n=n;
  el.innerHTML='<span class="tape"></span><p class="txt"></p><span class="stamp">已实现</span><span class="meta"></span>';
  el.querySelector('.txt').textContent=n.text;
  el.querySelector('.meta').textContent=`#${String(n.no).padStart(3,'0')} · ${fmt(n.ts)}`;
  el.addEventListener('pointerdown',onDown);
  el.addEventListener('dblclick',onDelete);
  return el;
}
function renderAll(){
  WALL.querySelectorAll('.note').forEach(e=>e.remove());
  state.notes.forEach(n=>WALL.appendChild(makeNote(n)));
}
function syncEmpty(){$('#empty').style.display=state.notes.length?'none':''}
function updateHud(){$('#hud').textContent=`WISHES ${state.notes.length} · GRANTED ${state.notes.filter(n=>n.granted).length}`}

/* ================= 拖拽 ================= */
function onDown(e){
  if(drag||(e.button!==undefined&&e.button!==0))return;
  e.preventDefault();
  const el=e.currentTarget;
  drag={n:el._n,el,x0:el._n.x,y0:el._n.y,px:e.clientX,py:e.clientY,moved:false};
  el.setPointerCapture(e.pointerId);
  el.addEventListener('pointermove',onMove);
  el.addEventListener('pointerup',onUp);
  el.addEventListener('pointercancel',onUp);
}
function onMove(e){
  if(!drag)return;
  const dx=e.clientX-drag.px,dy=e.clientY-drag.py;
  if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>4){
    drag.moved=true;drag.el.classList.add('dragging');
    drag.n.z=++zTop;drag.el.style.zIndex=zTop;
  }
  if(!drag.moved)return;
  drag.n.x=cX(drag.x0+dx,drag.el.offsetWidth+16);
  drag.n.y=cY(drag.y0+dy);
  drag.el.style.left=drag.n.x+'px';drag.el.style.top=drag.n.y+'px';
}
function onUp(){
  if(!drag)return;
  const el=drag.el;
  el.removeEventListener('pointermove',onMove);
  el.removeEventListener('pointerup',onUp);
  el.removeEventListener('pointercancel',onUp);
  el.classList.remove('dragging');
  if(drag.moved)save();
  drag=null;
}

/* ================= 增删 & 实现 ================= */
function addWish(){
  const t=INPUT.value.trim();
  if(!t){INPUT.classList.remove('shake');void INPUT.offsetWidth;INPUT.classList.add('shake');toast('愿望不能为空呀～');return}
  const n={id:uid(),no:++state.no,text:t,color:curColor,x:null,y:null,rot:rand(-7,7),granted:false,z:++zTop,ts:Date.now()};
  state.notes.push(n);save();
  const el=makeNote(n);el.classList.add('pop-in');WALL.appendChild(el);
  INPUT.value='';syncEmpty();updateHud();
  toast('愿望贴上墙啦 ✦');say(pick(cur().bubble));
}
function onDelete(e){
  const el=e.currentTarget,n=el._n;
  if(el.classList.contains('bye'))return;
  state.notes=state.notes.filter(m=>m!==n);
  lastDeleted={n};
  el.classList.add('bye');
  setTimeout(()=>{el.remove();syncEmpty()},330);
  save();updateHud();
  toast(`已撕掉「${trunc(n.text,12)}」`,{label:'撤销',fn:undoDelete});
}
function undoDelete(){
  if(!lastDeleted)return;
  const n=lastDeleted.n;
  n.x=cX(n.x,216);n.y=cY(n.y);n.z=++zTop;
  state.notes.push(n);save();
  WALL.appendChild(makeNote(n));syncEmpty();updateHud();
  lastDeleted=null;toast('放回墙上啦');
}
function grantWish(){
  const pool=state.notes.filter(n=>!n.granted);
  if(!state.notes.length){toast('墙上还没有愿望，先许一个吧');return}
  if(!pool.length){toast('所有愿望都已实现，再许一个新的吧！');return}
  const n=pick(pool);
  n.granted=true;n.z=++zTop;save();
  const el=[...WALL.children].find(e=>e._n===n);
  el.style.zIndex=zTop;el.classList.add('granted','pop');
  setTimeout(()=>el.classList.remove('pop'),760);
  const r=el.getBoundingClientRect();
  confetti(r.left+r.width/2,r.top+r.height/2);
  toast(`🎉 「${trunc(n.text,12)}」实现啦！`);
  say(pick(cur().cheer));updateHud();
}

/* ================= 视效 ================= */
function confetti(x,y){
  const EMO=['🎉','✨','💫','🎊','🐟','💙'];
  for(let i=0;i<16;i++){
    const s=document.createElement('span');s.className='cf';s.textContent=pick(EMO);
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',rand(-130,130).toFixed(0)+'px');
    s.style.setProperty('--dy',rand(-150,50).toFixed(0)+'px');
    s.style.setProperty('--rr',rand(-180,180).toFixed(0)+'deg');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),950);
  }
}
function toast(msg,opt){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  if(opt){const a=document.createElement('span');a.className='act';a.textContent=opt.label;a.onclick=()=>{opt.fn();t.remove()};t.appendChild(a)}
  TOASTS.appendChild(t);
  while(TOASTS.children.length>3)TOASTS.firstChild.remove();
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},opt?3400:2400);
}
function say(t){BUB.textContent=t;BUB.classList.remove('say');void BUB.offsetWidth;BUB.classList.add('say')}

/* ================= 主题 ================= */
const cur=()=>THEMES[state.theme]||THEMES.moyu;
function buildFx(){
  FX.innerHTML='';
  for(let i=0;i<12;i++){
    const s=document.createElement('span');
    s.textContent=pick(cur().words);
    s.style.left=rand(2,86)+'%';s.style.top=rand(4,88)+'%';
    s.style.fontSize=rand(12,26).toFixed(0)+'px';
    s.style.animationDuration=rand(7,14).toFixed(1)+'s';
    s.style.animationDelay=(-rand(0,8)).toFixed(1)+'s';
    FX.appendChild(s);
  }
}
function applyTheme(k){
  state.theme=k;save();
  document.body.classList.remove('theme-moyu','theme-tuodan','theme-facai');
  document.body.classList.add(cur().cls);
  $('#tagline').textContent=cur().tagline;
  INPUT.placeholder=cur().ph;
  $('#themeBtn .cur').textContent=cur().name;
  document.querySelectorAll('.menu button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
  buildFx();say(pick(cur().bubble));
}

/* ================= 事件绑定 ================= */
const DD=$('#themeDD');
$('#themeBtn').addEventListener('click',e=>{e.stopPropagation();DD.classList.toggle('open')});
document.addEventListener('click',()=>DD.classList.remove('open'));
document.querySelectorAll('.menu button[data-t]').forEach(b=>b.addEventListener('click',()=>{applyTheme(b.dataset.t);DD.classList.remove('open')}));

const SW=$('#swatches');
function selectSw(el){SW.querySelectorAll('.sel').forEach(s=>s.classList.remove('sel'));el.classList.add('sel')}
COLORS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='sw'+(c===curColor?' sel':'');b.style.background=c;b.title='便签颜色';
  b.onclick=()=>{curColor=c;selectSw(b)};
  SW.appendChild(b);
});
{
  const lab=document.createElement('label');lab.className='sw custom';lab.title='自定义颜色';
  const inp=document.createElement('input');inp.type='color';inp.value='#f8a5c2';
  inp.addEventListener('input',()=>{curColor=inp.value;lab.style.background=inp.value;selectSw(lab)});
  lab.appendChild(inp);SW.appendChild(lab);
}

$('#btnWish').addEventListener('click',addWish);
$('#btnGrant').addEventListener('click',grantWish);
INPUT.addEventListener('keydown',e=>{if(e.key==='Enter')addWish()});
$('#mascot').addEventListener('click',()=>say(pick(cur().bubble)));

addEventListener('resize',()=>{
  let dirty=false;
  state.notes.forEach(n=>{
    const nx=cX(n.x,216),ny=cY(n.y);
    if(nx!==n.x||ny!==n.y){n.x=nx;n.y=ny;dirty=true;
      const el=[...WALL.children].find(e=>e._n===n);
      if(el){el.style.left=nx+'px';el.style.top=ny+'px'}}
  });
  if(dirty)save();
});

/* ================= 启动 ================= */
applyTheme(state.theme||'moyu');
renderAll();syncEmpty();updateHud();
</script>
</body>
</html>
