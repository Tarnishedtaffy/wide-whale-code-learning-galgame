[package]
name = "mnk-study-loop"
version = "1.0.0"
description = "Mnk Study Loop multi-platform mobile & desktop learning app"
authors = ["Wide Whale Team"]
edition = "2021"

[lib]
name = "mnk_study_loop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
